# Simple HTML website
# Deploy static HTML files to Windows VM

trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: CopyFiles
    steps:
    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Copy HTML files'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
      displayName: 'Publish artifacts'

- stage: Deploy
  displayName: 'Deploy to Windows VM'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToVM
    displayName: 'Deploy HTML Website'
    environment:
      name: 'my-angular-vm'
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - task: CopyFilesOverSSH@0
            inputs:
              sshEndpoint: 'my-angular-vm-ssh'
              sourceFolder: '$(Pipeline.Workspace)/drop'
              contents: '**'
              targetFolder: 'C:/inetpub/wwwroot/html-site'
              overWrite: true