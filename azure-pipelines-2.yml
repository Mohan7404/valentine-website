# HTML pipeline with SSH deployment to Windows VM

trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  displayName: 'Build and Archive HTML'
  jobs:
  - job: ArchiveJob
    steps:
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: 'Deploy to Windows VM'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToVM
    displayName: 'Deploy HTML Site'
    environment:
      name: 'my-angular-vm'
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - task: CopyFilesOverSSH@0
            inputs:
              sshEndpoint: 'my-angular-vm-ssh'
              sourceFolder: '$(Pipeline.Workspace)/drop'
              contents: '**/*.zip'
              targetFolder: 'C:/inetpub/wwwroot/html-site'
              overWrite: true
          - task: ExtractFiles@1
            inputs:
              archiveFilePatterns: '$(Pipeline.Workspace)/drop/*.zip'
              destinationFolder: 'C:/inetpub/wwwroot/html-site'
              cleanDestinationFolder: true